name: Attach toolchain archives to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive:
    name: Package ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: arm-none-eabi-gcc
            archive: wch_arm_gcc_i686-mingw32
          - directory: RISC-V Embedded GCC
            archive: wch_riscv_gcc8_i686-mingw32
          - directory: RISC-V Embedded GCC12
            archive: wch_riscv_gcc12_i686-mingw32
          - directory: RISC-V Embedded GCC15
            archive: wch_riscv_gcc15_i686-mingw32

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Create zip archive
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ matrix.directory }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          zip -r "${RUNNER_TEMP}/${ARCHIVE_NAME}.zip" "$SOURCE_DIRECTORY"

      - name: Attach archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/${ARCHIVE_NAME}.zip" --clobber
